id: project
name: Project
description: A piece of delivery work for one client.
allocate_code:
  prefix: PRJ-
  start: 1001
  field: project_code
fields:
  - name: project_code
    type: string
    unique: true
    label: Project code
    help: Generated by the platform; never typed by the customer.
  - name: name
    type: string
    required: true
    label: Project name
  - name: client
    type: relation
    ref_entity: client
    label: Client
    help: Store the client record id. Assign it from the portal form.
  - name: status
    type: enum
    enum_values:
      - planning
      - active
      - on_hold
      - delivered
    default: planning
    label: Status
  - name: hourly_rate
    type: float
    format: currency
    label: Hourly rate
  - name: currency
    type: string
    default_from_setting: currency
  - name: open_tasks
    type: integer
    label: Open tasks
status_field: status
status_events:
  active: project.updated
  on_hold: project.updated
  delivered: project.updated
computed:
  - field: open_tasks
    op: relation_count
    relation: task
    foreign_key: project_id
title_field: name
views:
  - type: table
